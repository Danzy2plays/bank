<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking System</title>
    <style>
        body { font-family: Arial, sans-serif; }
        button { padding: 10px; margin: 10px; cursor: pointer; }
        input { padding: 10px; margin: 5px; }
    </style>
</head>
<body>

<h1>Banking System</h1>

<div id="login-register">
    <h2>Login or Register</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>
</div>

<div id="bank-dashboard" style="display:none;">
    <h2>Welcome, <span id="current-user"></span>!</h2>
    <h3>Balance: $<span id="balance">0</span></h3>
    <input type="text" id="receiver" placeholder="Receiver Username">
    <input type="number" id="amount" placeholder="Amount">
    <button onclick="transferMoney()">Transfer Money</button>
    <button onclick="logout()">Logout</button>
</div>

<script>
    let currentUser = null;

    async function register() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const res = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        alert(data.message || data.error);
    }

    async function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const res = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if (res.ok) {
            currentUser = username;
            document.getElementById("current-user").textContent = currentUser;
            showBankDashboard();
        } else {
            alert(data.error);
        }
    }

    async function transferMoney() {
        const receiver = document.getElementById("receiver").value;
        const amount = document.getElementById("amount").value;

        const res = await fetch('/transfer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sender: currentUser, receiver, amount })
        });
        const data = await res.json();

        if (res.ok) {
            alert(data.message);
            updateBalance();
        } else {
            alert(data.error);
        }
    }

    async function updateBalance() {
        const res = await fetch(`/balance?username=${currentUser}`);
        const data = await res.json();
        if (res.ok) {
            document.getElementById("balance").textContent = data.balance;
        } else {
            alert(data.error);
        }
    }

    function showBankDashboard() {
        document.getElementById("login-register").style.display = "none";
        document.getElementById("bank-dashboard").style.display = "block";
        updateBalance();
    }

    function logout() {
        currentUser = null;
        document.getElementById("login-register").style.display = "block";
        document.getElementById("bank-dashboard").style.display = "none";
    }
</script>

</body>
</html>
